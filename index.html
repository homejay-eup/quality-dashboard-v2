<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設備品質分析</title>
  <link rel="stylesheet" href="css/style.css?v=10" />
</head>
<body>
  <!-- ── Header ─────────────────────────────────────── -->
  <header class="app-header">
    <div class="app-header__inner">
      <div class="brand">
        <span class="brand__mark"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
        <div class="brand__text">
          <div class="brand__title">設備品質分析</div>
          <div class="brand__sub">EUP 弋揚科技</div>
        </div>
      </div>
    </div>
  </header>

  <!-- ── Hero ───────────────────────────────────────── -->
  <section class="hero">
    <div class="hero__inner">
      <h1 class="hero__title">設備品質分析工具</h1>
      <p class="hero__desc">依廠商、類型、ERP品號與季度彈性篩選，分析回廠、再使用、不良與過保品質。</p>
    </div>
  </section>

  <main class="container">
    <!-- ── 車機／鏡頭分析範圍分頁 ───────────────────── -->
    <nav class="device-tabs" id="device-tabs"></nav>

    <!-- ── 控制列（期間 / YoY）──────────────────────── -->
    <section class="controls card">
      <div class="controls__group">
        <label class="field">
          <span class="field__label">目前期間</span>
          <select id="sel-current"></select>
        </label>
        <label class="field">
          <span class="field__label">對比期間</span>
          <select id="sel-compare"></select>
        </label>
      </div>
      <!-- 快照動作 -->
      <div class="controls__actions">
        <button class="btn" id="btn-report"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8V4h10v4"/><rect x="4" y="8" width="16" height="8" rx="1.5"/><path d="M7 16h10v4H7z"/><circle cx="17" cy="11" r="0.6" fill="currentColor" stroke="none"/></svg> 生成落地頁報告</button>
        <button class="btn-ghost" id="btn-export"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10"/><path d="M8 10.5 12 14.5 16 10.5"/><path d="M5 17v1.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V17"/></svg> 匯出本期快照</button>
        <span class="controls__hint">報告＝當前篩選結果＋圖表＋品管/採購建議；快照供跨期比較</span>
      </div>
      <!-- 篩選器（filters.js 注入）-->
      <div id="filter-slot"></div>
      <!-- 指標顯示 -->
      <div class="metric-toggle">
        <button type="button" class="cols-toggle" id="metric-toggle-btn">
          指標顯示<span class="cols-toggle__arrow">▸</span>
        </button>
        <div id="metric-chips" class="chips" hidden></div>
      </div>
    </section>

    <!-- ── 載入 / 錯誤 狀態 ─────────────────────────── -->
    <div id="status" class="status" hidden></div>

    <!-- ── 主內容（載入完成才顯示）──────────────────── -->
    <div id="content" hidden>
      <!-- KPI 主卡列 -->
      <section class="cards" id="kpi-primary"></section>
      <!-- KPI 次卡列 -->
      <section class="cards cards--secondary" id="kpi-secondary"></section>

      <!-- 詳細明細：精簡固定欄位（detail.js 注入）-->
      <div id="detail-simple-slot"></div>

      <!-- 明細分析表：完整欄位，依品號彙整（detail.js 注入）-->
      <div id="detail-slot"></div>

      <!-- 明細：逐筆原始判定，21欄（rawtable.js 注入）-->
      <div id="raw-slot"></div>

      <!-- 品管/採購建議（advice.js 注入）-->
      <div id="advice-slot"></div>
    </div>
  </main>

  <!-- ── ☁️ 共用雲端快照選取 modal ────────────────────── -->
  <div class="modal-overlay" id="cloud-modal">
    <div class="modal">
      <div class="modal__head">
        <span class="modal__title"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h9.5a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.6-1.7A3.8 3.8 0 0 0 7 18Z"/></svg> 從共用雲端選取快照</span>
        <button class="modal__close" id="cloud-modal-close"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="modal__body" id="cloud-modal-body"></div>
    </div>
  </div>

  <!-- ── 相依函式庫（CDN）──────────────────────────── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- ── 本地模組（依序）；?v= 為快取版本號，改動 js 時一併調高 ── -->
  <script src="js/icons.js?v=1"></script>
  <script src="js/config.js?v=6"></script>
  <script src="js/sheets.js?v=3"></script>
  <script src="js/transform.js?v=4"></script>
  <script src="js/metrics.js?v=8"></script>
  <script src="js/filters.js?v=2"></script>
  <script src="js/tablefilter.js?v=5"></script>
  <script src="js/detail.js?v=21"></script>
  <script src="js/rawtable.js?v=13"></script>
  <script src="js/advice.js?v=2"></script>
  <script src="js/report.js?v=16"></script>
  <script src="js/cloud.js?v=2"></script>
  <script src="js/app.js?v=13"></script>
  <input type="file" id="snap-file" accept="application/json,.json" hidden />
</body>
</html>
